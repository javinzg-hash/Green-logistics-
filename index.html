<script type="text/babel">

const firebaseConfig = {
  apiKey: "AIzaSyAWaYclmMYQ0aQAtJhBxg00LBiEcD0df_E",

  auth = firebase.auth();
} catch (e) {

const RAD = Math.PI / 180;
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * RAD;
  const dLon = (lon2 - lon1) * RAD;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*RAD)*Math.cos(lat2*RAD)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function geocode(address) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("geocode failed");
  const data = await res.json();
  if (!data.length) throw new Error("not found");
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
}

function trackingCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "GL-";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

const STATUS_META = {
  pending_assignment: { label: "Awaiting rider", color: "#C98A2E" },
  assigned: { label: "Rider assigned", color: "#3A6EA5" },
  out_for_delivery: { label: "Out for delivery", color: "#2E8B7A" },
  delivered: { label: "Delivered", color: "#3F7D3A" },
};

function Barcode() {
  return <div style={{ height: 28, background: "repeating-linear-gradient(90deg, #1C1C1C 0px, #1C1C1C 2px, transparent 2px, transparent 5px, #1C1C1C 5px, #1C1C1C 6px, transparent 6px, transparent 10px)", opacity: 0.85, borderRadius: 2 }} />;
}

function StampBadge({ status }) {
  const meta = STATUS_META[status];
  return (
    <div style={{ border: `2px solid ${meta.color}`, color: meta.color, padding: "3px 10px", borderRadius: 4, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", transform: "rotate(-3deg)", display: "inline-block", whiteSpace: "nowrap" }}>
      {meta.label}
    </div>
  );
}

function PaymentPrompt({ order, settings }) {
  if (order.status !== "delivered" || order.paymentReceived) return null;
  if (!settings.momoNumber) return null;
  return (
    <div style={{ background: "#EAF6EE", border: "1px solid #2E8B57", borderRadius: 8, padding: 14, marginTop: -8, marginBottom: 16 }}>
      <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, marginBottom: 4 }}>
        Delivered — pay now
      </div>
      <div style={{ color: "#4C7A5E", fontSize: 13, marginBottom: 8 }}>
        Send {order.currency} {order.price.toLocaleString()} to complete this order.
      </div>
      <div style={{ color: "#2E8B57", fontFamily: "'IBM Plex Mono', monospace", fontSize: 20, fontWeight: 600 }}>
        {settings.momoNumber}
      </div>
    </div>
  );
}

function WaybillCard({ order, children }) {
  return (
    <div style={{ background: "#F3FAF5", borderRadius: 10, overflow: "hidden", boxShadow: "0 4px 14px rgba(0,0,0,0.25)", marginBottom: 16 }}>
      <div style={{ padding: "14px 16px 10px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#4C7A5E", letterSpacing: "0.05em" }}>{order.trackingCode}</div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 17, color: "#1C1C1C", marginTop: 2 }}>{order.item}</div>
          </div>
          <StampBadge status={order.status} />
        </div>
        <div style={{ marginTop: 10, fontSize: 13.5, color: "#3A3A3A", lineHeight: 1.5 }}>
          <div><strong>From</strong> — {order.pickup}</div>
          <div><strong>To</strong> — {order.delivery}</div>
          <div style={{ marginTop: 4, color: "#4C7A5E" }}>
            {order.distanceKm.toFixed(1)} km · {order.currency} {order.price.toLocaleString()} · customer: {order.customerName}
            {order.riderName ? ` · rider: ${order.riderName}` : ""}
          </div>
          {order.customerPhone && (
            <div style={{ marginTop: 2 }}>
              <a href={`tel:${order.customerPhone}`} style={{ color: "#3A6EA5", fontSize: 13, textDecoration: "none" }}>📞 Call {order.customerPhone}</a>
            </div>
          )}
          <div style={{ marginTop: 6, display: "flex", gap: 14 }}>
            <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(order.pickup)}`} target="_blank" rel="noopener" style={{ color: "#2E8B7A", fontSize: 13, textDecoration: "none" }}>🧭 Navigate to pickup</a>
            <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(order.delivery)}`} target="_blank" rel="noopener" style={{ color: "#2E8B7A", fontSize: 13, textDecoration: "none" }}>🧭 Navigate to delivery</a>
          </div>
        </div>
      </div>
      <div style={{ padding: "0 16px" }}><div style={{ borderTop: "2px dashed #BEE3CB" }} /></div>
      <Barcode />
      {children && <div style={{ padding: "12px 16px 16px" }}>{children}</div>}
    </div>
  );
}

function TabButton({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "10px 4px", background: "none", border: "none", borderBottom: active ? "3px solid #2E8B57" : "3px solid transparent", color: active ? "#123524" : "#4C7A5E", cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, fontWeight: 600 }}>
      <span style={{ fontSize: 18 }}>{emoji}</span>
      {label}
    </button>
  );
}

function Field({ label, value, onChange, placeholder, type = "text" }) {
  return (
    <label style={{ display: "block", marginBottom: 12 }}>
      <div style={{ fontSize: 12.5, color: "#4C7A5E", marginBottom: 4, fontWeight: 500 }}>{label}</div>
      <input type={type} value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)}
        style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #7FC79A", background: "#EAF6EE", color: "#123524", fontSize: 14.5 }} />
    </label>
  );
}

function PrimaryButton({ children, onClick, disabled, style }) {
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ width: "100%", padding: "12px 16px", borderRadius: 8, border: "none", background: disabled ? "#A9D9BB" : "#2E8B57", color: disabled ? "#4C7A5E" : "#FFFFFF", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 14.5, cursor: disabled ? "not-allowed" : "pointer", ...style }}>
      {children}
    </button>
  );
}

// ============================================================
// STEP FOR YOU: change this to your own secret word before sharing links.
// Your admin link will be: index.html?admin=YOUR_SECRET
// Rider link (share with riders): index.html?rider=1
// Plain link (share with customers): index.html  — no extra part needed
// ============================================================
const ADMIN_KEY = "greenlog2026";

function getRole() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") === ADMIN_KEY) return "admin";
  if (params.get("rider") === "1") return "rider";
  return "customer";
}

function App() {
  const role = React.useMemo(getRole, []);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState(role === "admin" ? "admin" : role);
  const [orders, setOrders] = useState([]);
  const [settings, setSettings] = useState({ ratePerKm: 500, currency: "UGX", momoNumber: "" });
  const [dbError, setDbError] = useState(false);
  const seenIds = React.useRef(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);

  useEffect(() => {
    if (!auth) { setAuthReady(true); return; }
    const unsub = auth.onAuthStateChanged((u) => { setUser(u); setAuthReady(true); });
    return () => unsub();
  }, []);

  const signIn = useCallback(() => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch((e) => {
      console.warn(e);
      alert("Sign-in failed: " + (e.message || e.code || "please try again"));
    });
  }, []);
  const signOutUser = useCallback(() => auth.signOut(), []);

  useEffect(() => {
    if (!db) { setDbError(true); setReady(true); return; }
    const unsubOrders = db.collection("orders").orderBy("createdAt", "desc").onSnapshot(
      (snap) => setOrders(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (err) => { console.error(err); setDbError(true); }
    );
    db.collection("settings").doc("main").get().then((doc) => {
      if (doc.exists) setSettings(doc.data());
      setReady(true);
    }).catch(() => setReady(true));
    return () => unsubOrders();
  }, []);

  // Admin gets notified in real time when a new order comes in (while app is open)
  useEffect(() => {
    if (role !== "admin") return;
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission();
    }
  }, [role]);

  useEffect(() => {
    if (role !== "admin") return;
    if (seenIds.current === null) {
      seenIds.current = new Set(orders.map((o) => o.id));
      return;
    }
    orders.forEach((o) => {
      if (!seenIds.current.has(o.id)) {
        seenIds.current.add(o.id);
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          new Notification("New delivery order", { body: `${o.customerName}: ${o.item}` });
        }
      }
    });
  }, [orders, role]);

  const addOrder = useCallback(async (order) => {
    await db.collection("orders").add(order);
  }, []);
  const updateOrder = useCallback(async (id, patch) => {
    await db.collection("orders").doc(id).update(patch);
  }, []);
  const saveSettings = useCallback(async (next) => {
    setSettings(next);
    await db.collection("settings").doc("main").set(next);
  }, []);

  if (!ready) {
    return <div style={{ minHeight: "100vh", background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", color: "#123524" }}>Loading…</div>;
  }

  if (dbError) {
    return (
      <div style={{ minHeight: "100vh", background: "#FFFFFF", color: "#123524", padding: 24, fontFamily: "'Inter', sans-serif" }}>
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Firebase isn't configured yet</h2>
        <p style={{ color: "#4C7A5E", lineHeight: 1.6 }}>
          Open index.html and paste your Firebase config into the <code>firebaseConfig</code> object near the top of the script.
          Free setup: console.firebase.google.com → create project → Firestore Database → create in test mode → Project settings → add a Web app → copy the config.
        </p>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#FFFFFF" }}>
      <div style={{ padding: "22px 18px 0", maxWidth: 480, margin: "0 auto" }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: "#123524", display: "flex", alignItems: "center", gap: 8 }}>
          🍃 Green Logistics
        </div>
        <div style={{ color: "#4C7A5E", fontSize: 13, marginTop: 2 }}>Distance-based delivery, priced automatically</div>
      </div>

      {role === "admin" && (
        <div style={{ display: "flex", marginTop: 18, borderBottom: "1px solid #BEE3CB", maxWidth: 480, margin: "18px auto 0", padding: "0 18px" }}>
          <TabButton active={tab === "customer"} onClick={() => setTab("customer")} emoji="🗺️" label="Customer" />
          <TabButton active={tab === "rider"} onClick={() => setTab("rider")} emoji="🚚" label="Rider" />
          <TabButton active={tab === "admin"} onClick={() => setTab("admin")} emoji="📋" label="Admin" />
        </div>
      )}

      <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 18px 60px" }}>
        {tab === "customer" && <CustomerView orders={orders} addOrder={addOrder} settings={settings} user={user} authReady={authReady} signIn={signIn} signOutUser={signOutUser} />}
        {tab === "rider" && <RiderView orders={orders} updateOrder={updateOrder} />}
        {tab === "admin" && <AdminView orders={orders} updateOrder={updateOrder} settings={settings} saveSettings={saveSettings} />}
      </div>
    </div>
  );
}

function CustomerView({ orders, addOrder, settings, user, authReady, signIn, signOutUser }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [profileLoaded, setProfileLoaded] = useState(false);
  const [pickup, setPickup] = useState("");
  const [delivery, setDelivery] = useState("");
  const [item, setItem] = useState("");
  const [manualKm, setManualKm] = useState("");
  const [quote, setQuote] = useState(null);
  const [status, setStatus] = useState("idle");
  const [errorMsg, setErrorMsg] = useState("");
  const [lookupCode, setLookupCode] = useState("");
  const [confirmedCode, setConfirmedCode] = useState(null);

  useEffect(() => {
    if (user && !name) setName(user.displayName || "");
  }, [user]);

  useEffect(() => {
    if (!user || !db) return;
    db.collection("customers").doc(user.uid).get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        if (data.phone) setPhone(data.phone);
        if (data.name) setName(data.name);
      }
      setProfileLoaded(true);
    }).catch(() => setProfileLoaded(true));
  }, [user]);

  const found = orders.find((o) => o.trackingCode.toLowerCase() === lookupCode.trim().toLowerCase());
  const myOrders = user ? orders.filter((o) => o.customerUid === user.uid) : [];

  if (!authReady) {
    return <div style={{ color: "#4C7A5E", textAlign: "center", padding: 40 }}>Loading…</div>;
  }

  if (!user) {
    return (
      <div style={{ textAlign: "center", padding: "40px 10px" }}>
        <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 20, marginBottom: 10 }}>
          Sign in to request a delivery
        </div>
        <div style={{ color: "#4C7A5E", fontSize: 14, marginBottom: 22 }}>
          We use your Google account so you can track your own orders.
        </div>
        <PrimaryButton onClick={signIn}>Sign in with Google</PrimaryButton>
      </div>
    );
  }

  async function handleQuote() {
    setErrorMsg("");
    if (!pickup || !delivery || !item || !name || !phone) { setErrorMsg("Fill in your name, phone number, pickup, delivery and item first."); return; }
    setStatus("calculating");
    try {
      const [a, b] = await Promise.all([geocode(pickup), geocode(delivery)]);
      const km = haversineKm(a.lat, a.lon, b.lat, b.lon);
      setQuote({ km, price: Math.round(km * settings.ratePerKm) });
      setStatus("quoted");
    } catch {
      setStatus("manual");
      setErrorMsg("Couldn't auto-calculate distance — enter distance in km manually below.");
    }
  }

  function handleManualQuote() {
    const km = parseFloat(manualKm);
    if (!km || km <= 0) { setErrorMsg("Enter a valid distance in km."); return; }
    setQuote({ km, price: Math.round(km * settings.ratePerKm) });
    setStatus("quoted"); setErrorMsg("");
  }

  async function handleConfirm() {
    const order = {
      trackingCode: trackingCode(), customerName: name, customerUid: user.uid, customerEmail: user.email || "", customerPhone: phone, pickup, delivery, item,
      distanceKm: quote.km, price: quote.price, currency: settings.currency,
      status: "pending_assignment", riderName: "", paymentReceived: false, createdAt: Date.now(),
    };
    await addOrder(order);
    if (db) db.collection("customers").doc(user.uid).set({ name, phone }, { merge: true }).catch(() => {});
    setConfirmedCode(order.trackingCode);
    setName(""); setPickup(""); setDelivery(""); setItem(""); setManualKm(""); setQuote(null); setStatus("idle");
  }

  if (confirmedCode) {
    return (
      <div>
        <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18, marginBottom: 10 }}>Order placed</div>
        <WaybillCard order={orders.find((o) => o.trackingCode === confirmedCode) || { trackingCode: confirmedCode, item, pickup, delivery, distanceKm: quote?.km || 0, price: quote?.price || 0, currency: settings.currency, customerName: name, status: "pending_assignment" }} />
        <PaymentPrompt order={orders.find((o) => o.trackingCode === confirmedCode) || {}} settings={settings} />
        <div style={{ color: "#4C7A5E", fontSize: 13, marginBottom: 14 }}>Save this tracking code — search it below anytime to check status.</div>
        <PrimaryButton onClick={() => setConfirmedCode(null)}>Place another order</PrimaryButton>
      </div>
    );
  }

  return (
    <div>
      <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18, marginBottom: 12 }}>Request a delivery</div>
      <Field label="Your name" value={name} onChange={setName} placeholder="Jane Doe" />
      <Field label="Your phone number" value={phone} onChange={setPhone} placeholder="e.g. 0771 234 567" type="tel" />
      <Field label="Pickup address" value={pickup} onChange={setPickup} placeholder="e.g. Nakawa Market, Kampala" />
      <Field label="Delivery address" value={delivery} onChange={setDelivery} placeholder="e.g. Bugolobi, Kampala" />
      <Field label="Item description" value={item} onChange={setItem} placeholder="What's being delivered?" />
      {errorMsg && <div style={{ color: "#E0A85C", fontSize: 13, marginBottom: 10 }}>{errorMsg}</div>}
      {status === "manual" && (<>
        <Field label="Distance (km)" value={manualKm} onChange={setManualKm} placeholder="e.g. 6.5" type="number" />
        <PrimaryButton onClick={handleManualQuote}>Get price</PrimaryButton>
      </>)}
      {status !== "manual" && !quote && (
        <PrimaryButton onClick={handleQuote} disabled={status === "calculating"}>
          {status === "calculating" ? "Calculating distance…" : "Calculate price"}
        </PrimaryButton>
      )}
      {quote && (
        <div style={{ background: "#EAF6EE", border: "1px solid #7FC79A", borderRadius: 8, padding: 14, marginTop: 4 }}>
          <div style={{ color: "#4C7A5E", fontSize: 13 }}>{quote.km.toFixed(1)} km × {settings.currency} {settings.ratePerKm}/km</div>
          <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, margin: "4px 0 10px" }}>{settings.currency} {quote.price.toLocaleString()}</div>
          <div style={{ color: "#4C7A5E", fontSize: 12.5, marginBottom: 10 }}>Pay this amount to the mobile money number provided by the admin, then confirm below.</div>
          <PrimaryButton onClick={handleConfirm}>Confirm order</PrimaryButton>
        </div>
      )}
      <div style={{ marginTop: 30, borderTop: "1px solid #BEE3CB", paddingTop: 18 }}>
        <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, marginBottom: 10 }}>Track an order</div>
        <input value={lookupCode} onChange={(e) => setLookupCode(e.target.value)} placeholder="GL-XXXXXX"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #7FC79A", background: "#EAF6EE", color: "#123524", fontFamily: "'IBM Plex Mono', monospace" }} />
        {lookupCode && (found ? <div style={{ marginTop: 12 }}><WaybillCard order={found} /><PaymentPrompt order={found} settings={settings} /></div> : <div style={{ color: "#4C7A5E", fontSize: 13, marginTop: 10 }}>No order with that code.</div>)}
      </div>

      {myOrders.length > 0 && (
        <div style={{ marginTop: 30, borderTop: "1px solid #BEE3CB", paddingTop: 18 }}>
          <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, marginBottom: 10 }}>My orders</div>
          {myOrders.map((o) => <div key={o.id}><WaybillCard order={o} /><PaymentPrompt order={o} settings={settings} /></div>)}
        </div>
      )}

      <div style={{ marginTop: 24, textAlign: "center" }}>
        <span style={{ color: "#4C7A5E", fontSize: 13 }}>Signed in as {user.displayName || user.email}</span>
        {" · "}
        <span onClick={signOutUser} style={{ color: "#2E8B57", fontSize: 13, cursor: "pointer" }}>Sign out</span>
      </div>
    </div>
  );
}

function RiderView({ orders, updateOrder }) {
  const [riderName, setRiderName] = useState("");
  const mine = orders.filter((o) => o.riderName && o.riderName.toLowerCase() === riderName.trim().toLowerCase());

  return (
    <div>
      <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18, marginBottom: 12 }}>Your deliveries</div>
      <Field label="Your rider name (as assigned by admin)" value={riderName} onChange={setRiderName} placeholder="e.g. Moses" />
      {riderName && mine.length === 0 && <div style={{ color: "#4C7A5E", fontSize: 13 }}>No deliveries assigned to you yet.</div>}
      {mine.map((o) => (
        <WaybillCard key={o.id} order={o}>
          {o.status === "assigned" && <PrimaryButton onClick={() => updateOrder(o.id, { status: "out_for_delivery" })}>Start delivery</PrimaryButton>}
          {o.status === "out_for_delivery" && <PrimaryButton onClick={() => updateOrder(o.id, { status: "delivered" })} style={{ background: "#3F7D3A", color: "#123524" }}>✔ Mark delivered</PrimaryButton>}
          {o.status === "delivered" && <div style={{ color: "#4C7A5E", fontSize: 13, textAlign: "center" }}>Completed</div>}
        </WaybillCard>
      ))}
    </div>
  );
}

function AdminView({ orders, updateOrder, settings, saveSettings }) {
  const [riderInputs, setRiderInputs] = useState({});
  const [showSettings, setShowSettings] = useState(false);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ color: "#123524", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 18 }}>All orders ({orders.length})</div>
        <button onClick={() => setShowSettings((s) => !s)} style={{ background: "none", border: "1px solid #7FC79A", color: "#4C7A5E", borderRadius: 6, padding: "6px 10px", fontSize: 12.5, cursor: "pointer" }}>
          {showSettings ? "Hide settings" : "Pricing settings"}
        </button>
      </div>
      {showSettings && (
        <div style={{ background: "#EAF6EE", border: "1px solid #7FC79A", borderRadius: 8, padding: 14, marginBottom: 18 }}>
          <Field label="Rate per km" value={settings.ratePerKm} onChange={(v) => saveSettings({ ...settings, ratePerKm: Number(v) || 0 })} type="number" />
          <Field label="Currency label" value={settings.currency} onChange={(v) => saveSettings({ ...settings, currency: v })} />
          <Field label="Your mobile money number" value={settings.momoNumber || ""} onChange={(v) => saveSettings({ ...settings, momoNumber: v })} placeholder="e.g. 0771 234 567" />
        </div>
      )}
      {orders.length === 0 && <div style={{ color: "#4C7A5E", fontSize: 13 }}>No orders yet.</div>}
      {orders.map((o) => (
        <WaybillCard key={o.id} order={o}>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#3A3A3A" }}>
              <input type="checkbox" checked={o.paymentReceived} onChange={() => updateOrder(o.id, { paymentReceived: !o.paymentReceived })} />
              Payment received
            </label>
            {o.status === "pending_assignment" && (
              <div style={{ display: "flex", gap: 8 }}>
                <input value={riderInputs[o.id] || ""} onChange={(e) => setRiderInputs({ ...riderInputs, [o.id]: e.target.value })} placeholder="Rider name"
                  style={{ flex: 1, padding: "8px 10px", borderRadius: 6, border: "1px solid #BEE3CB" }} />
                <button onClick={() => { const r = (riderInputs[o.id]||"").trim(); if (r) updateOrder(o.id, { riderName: r, status: "assigned" }); }}
                  style={{ background: "#2E8B57", border: "none", borderRadius: 6, padding: "0 14px", fontWeight: 700, cursor: "pointer" }}>Assign</button>
              </div>
            )}
          </div>
        </WaybillCard>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
